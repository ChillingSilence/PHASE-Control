[pytest]
# Home Assistant fixtures are async; the plugin expects auto mode.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Home Assistant 2026.11 puts httpx2 in place of httpx as it is imported, and refuses once httpx is
# loaded. respx's own pytest plugin loads it first, so it stays off; respx itself still works.
addopts = -p no:respx
markers =
    web_server: runs Home Assistant's real web server (its websocket and REST API)
